<!doctype html>
<html lang="no"><head>
<meta charset="utf-8" />
<title>Guttulsrød — Et hjem er mer.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300;9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4ECDC;
    --paper-2:#EDE2CC;
    --ink:#1A1410;
    --ink-soft:#5A4B3D;
    --green:#7B9F1A;
    --green-deep:#4D6810;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  html,body{background:#0a0805;font-family:'Fraunces',serif;color:var(--ink)}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}

  #stage{
    position:relative;width:1080px;height:1080px;overflow:hidden;
    background:
      radial-gradient(140% 110% at 50% 35%, var(--paper) 0%, var(--paper-2) 100%);
    box-shadow:0 30px 90px rgba(0,0,0,.55);
    isolation:isolate;
  }
  /* paper grain — extremely subtle, like Apple keynote */
  #stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:90;opacity:.06;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='280'><filter id='n'><feTurbulence baseFrequency='0.78' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  /* soft vignette */
  #stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:80;
    background:radial-gradient(110% 110% at 50% 50%, transparent 55%, rgba(26,20,16,.10) 100%);
  }

  /* every act is centered, alone on stage */
  .act{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
    text-align:center;padding:0 140px;z-index:10;
  }

  /* shared mask-line reveal */
  .mask{display:block;overflow:hidden;line-height:1.05;padding:.05em 0}
  .mask > span{display:inline-block;transform:translateY(110%);will-change:transform}

  /* ---- A1: emotional setup ---- */
  .a1 .line{
    font-family:'Fraunces',serif;font-weight:300;font-size:96px;letter-spacing:-.025em;color:var(--ink);
  }
  .a1 .line em{font-style:italic;font-weight:400}

  /* ---- A2: three echoes (smaller lines that come/go) ---- */
  .a2 .echo{
    font-family:'Fraunces',serif;font-weight:300;font-style:italic;font-size:72px;letter-spacing:-.02em;color:var(--ink);opacity:0
  }

  /* ---- A3: the pivot ---- */
  .a3 .pivot{
    font-family:'Fraunces',serif;font-weight:300;font-size:84px;letter-spacing:-.02em;color:var(--ink-soft);
    font-style:italic
  }
  .a3 .pivot em{color:var(--ink);font-weight:500;font-style:normal;
    background:linear-gradient(180deg, transparent 65%, rgba(123,159,26,.32) 65%, rgba(123,159,26,.32) 92%, transparent 92%);
    padding:0 .12em
  }

  /* ---- A4: the question (the heart of the ad) ---- */
  .a4 .q{
    font-family:'Fraunces',serif;font-weight:300;font-size:140px;letter-spacing:-.035em;line-height:.98;color:var(--ink)
  }
  .a4 .q em{font-style:italic;font-weight:400}
  /* small subscript answer */
  .a4 .ans{
    margin-top:48px;font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.5em;text-transform:uppercase;color:var(--green-deep);opacity:0
  }
  .a4 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:14px;vertical-align:middle;box-shadow:0 0 12px rgba(123,159,26,.5)}

  /* ---- A5: the brand moment ---- */
  .a5 .brand-wrap{display:flex;flex-direction:column;align-items:center;gap:36px}
  .a5 .name{
    font-family:'Fraunces',serif;font-weight:300;font-size:152px;letter-spacing:-.045em;color:var(--ink);line-height:1
  }
  .a5 .name .it{font-style:italic;font-weight:400}
  .a5 .ampersand{font-family:'Fraunces',serif;font-style:italic;font-weight:300;color:var(--green-deep);opacity:0}
  .a5 .seal{
    width:auto;height:38px;opacity:0
  }
  .a5 .rule{height:1px;width:0;background:var(--ink-soft);opacity:.4}
  .a5 .meta{
    font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.55em;text-transform:uppercase;color:var(--ink-soft);
    display:flex;gap:22px;align-items:center;opacity:0
  }
  .a5 .meta span{position:relative}
  .a5 .meta span:not(:last-child)::after{
    content:"";position:absolute;right:-13px;top:50%;width:3px;height:3px;border-radius:50%;background:var(--ink-soft);transform:translateY(-50%)
  }

  /* ---- A6: CTA — quiet confidence ---- */
  .a6 .cta-head{
    font-family:'Fraunces',serif;font-weight:300;font-size:96px;letter-spacing:-.025em;color:var(--ink);line-height:1.04
  }
  .a6 .cta-head em{font-style:italic;font-weight:500;color:var(--green-deep)}
  .a6 .cta-url{
    margin-top:40px;font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:42px;color:var(--ink);letter-spacing:-.01em;
    border-bottom:1.5px solid var(--green);padding-bottom:6px;opacity:0
  }

  /* signature bottom — appears only at very end */
  .sig{
    position:absolute;bottom:54px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;z-index:50;opacity:0;
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--ink-soft)
  }
  .sig .nl{display:inline-flex;align-items:center;gap:8px}
  .sig .nl-badge{width:22px;height:22px;background:var(--ink);border-radius:5px;display:grid;place-items:center}
  .sig .nl-badge img{height:14px;width:auto;filter:brightness(0) invert(1);opacity:.95}

  /* hidden by default */
  .act{opacity:0}
  #a1{opacity:1}  /* first act visible from start; its CONTENTS are masked */
</style></head>
<body>

<div id="stage">

  <!-- ==================== ACT 1: hook (0 — 4s) ==================== -->
  <div class="act a1" id="a1">
    <div class="line mask"><span>Et hjem er <em>mer</em></span></div>
    <div class="line mask"><span>enn et hus.</span></div>
  </div>

  <!-- ==================== ACT 2: echoes (4 — 11s) ==================== -->
  <div class="act a2" id="a2">
    <div class="echo" id="e1">Det er stemmer i trappen.</div>
    <div class="echo" id="e2" style="position:absolute">Det er kvelder du husker.</div>
    <div class="echo" id="e3" style="position:absolute">Det er trygghet.</div>
  </div>

  <!-- ==================== ACT 3: pivot (11 — 14.5s) ==================== -->
  <div class="act a3" id="a3">
    <div class="pivot mask"><span>Men det har også <em>en verdi.</em></span></div>
  </div>

  <!-- ==================== ACT 4: the question (14.5 — 19s) ==================== -->
  <div class="act a4" id="a4">
    <div class="q mask"><span>Hva er det <em>verdt</em>?</span></div>
    <div class="ans"><span class="dot"></span>SVARET FÅR DU GRATIS</div>
  </div>

  <!-- ==================== ACT 5: brand (19 — 24s) ==================== -->
  <div class="act a5" id="a5">
    <div class="brand-wrap">
      <div class="name">
        <span class="mask"><span>Lars <span class="it">&amp;</span> Ida</span></span>
        <span class="mask"><span class="it">Guttulsrød.</span></span>
      </div>
      <div class="meta" id="a5meta"><span>Far og datter</span><span>Eiendomsmeglere</span><span>Moss siden 1991</span></div>
    </div>
  </div>

  <!-- ==================== ACT 6: CTA (24 — 30s) ==================== -->
  <div class="act a6" id="a6">
    <div class="cta-head mask"><span>Få boligen din</span></div>
    <div class="cta-head mask"><span>vurdert <em>gratis.</em></span></div>
    <div class="cta-url" id="ctaUrl">guttulsrod.no</div>
  </div>

  <!-- signature bottom (only at end) -->
  <div class="sig" id="sig">
    <span>Levert av</span>
    <span class="nl"><span class="nl-badge"><img src="norleads-logo.png" alt="Norleads"></span></span>
  </div>

</div>

<script>__GSAP__</script>
<script>
document.addEventListener('DOMContentLoaded', () => {

  const tl = gsap.timeline({ defaults:{ ease:'power3.out' } });

  /* ============================================================
     A1 — emotional hook (0 → 4s)
     ============================================================ */
  tl.to('#a1 .mask > span', { y:0, duration:1.0, stagger:.55 }, 0.6)
    .to('#a1', { opacity:0, duration:.7, ease:'power2.inOut' }, 3.7);

  /* ============================================================
     A2 — three echoes (4 → 11s)
     ============================================================ */
  tl.set('#a2', { opacity:1 }, 4.2);

  // e1: in @ 4.4, hold, out @ 6.6
  tl.fromTo('#e1', { opacity:0, y:14 }, { opacity:1, y:0, duration:.9, ease:'power3.out' }, 4.4)
    .to('#e1', { opacity:0, y:-8, duration:.6, ease:'power2.in' }, 6.6);

  // e2: in @ 6.6, hold, out @ 8.7
  tl.fromTo('#e2', { opacity:0, y:14 }, { opacity:1, y:0, duration:.9, ease:'power3.out' }, 6.6)
    .to('#e2', { opacity:0, y:-8, duration:.6, ease:'power2.in' }, 8.7);

  // e3: in @ 8.7, hold longer (it's the emotional peak)
  tl.fromTo('#e3', { opacity:0, y:14 }, { opacity:1, y:0, duration:.9, ease:'power3.out' }, 8.7)
    .to('#a2', { opacity:0, duration:.8, ease:'power2.inOut' }, 10.6);

  /* ============================================================
     A3 — pivot (11.4 → 14.6s)
     ============================================================ */
  tl.set('#a3', { opacity:1 }, 11.5)
    .to('#a3 .mask > span', { y:0, duration:.9 }, 11.6)
    .to('#a3', { opacity:0, duration:.6, ease:'power2.inOut' }, 14.2);

  /* ============================================================
     A4 — the question (14.7 → 19s)
     ============================================================ */
  tl.set('#a4', { opacity:1 }, 14.8)
    .to('#a4 .q .mask > span, #a4 .mask > span', { y:0, duration:1.0 }, 14.9)
    .fromTo('#a4 .ans', { opacity:0, y:10 }, { opacity:1, y:0, duration:.7 }, 16.4)
    .to('#a4', { opacity:0, duration:.7, ease:'power2.inOut' }, 18.6);

  /* ============================================================
     A5 — brand (19.2 → 24s)
     ============================================================ */
  tl.set('#a5', { opacity:1 }, 19.2)
    .to('#a5 .mask > span', { y:0, duration:1.0, stagger:.25 }, 19.4)
    .fromTo('#a5meta', { opacity:0, y:14 }, { opacity:1, y:0, duration:.8 }, 21.0)
    .to('#a5', { opacity:0, duration:.7, ease:'power2.inOut' }, 23.6);

  /* ============================================================
     A6 — CTA (24 → 30s)
     ============================================================ */
  tl.set('#a6', { opacity:1 }, 24.2)
    .to('#a6 .mask > span', { y:0, duration:.95, stagger:.35 }, 24.3)
    .fromTo('#ctaUrl', { opacity:0, y:14 }, { opacity:1, y:0, duration:.9 }, 25.8)
    // url accent underline already in CSS — emphasize with subtle scale beat
    .to('#ctaUrl', { letterSpacing:'0em', duration:1.4, ease:'sine.out' }, 25.8);

  // signature appears at very end
  tl.fromTo('#sig', { opacity:0, y:6 }, { opacity:.85, y:0, duration:.8 }, 27.4);

});
</script>
</body></html>
