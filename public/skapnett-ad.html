<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8" />
<title>Skapnett — Klar for drømmeskapet?</title>
<meta name="viewport" content="width=1080" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0807;
    --bg-1:#15110e;
    --ink:#f5efe6;
    --ink-soft:#bdb3a4;
    --accent:#e07a4f;     /* warm coral/orange */
    --accent-2:#f5b27a;   /* lighter glow */
    --gold:#d9a26b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;overflow:hidden;font-family:'Inter',sans-serif;color:var(--ink)}
  body{display:grid;place-items:center;min-height:100vh}

  .stage{
    position:relative;
    width:1080px;height:1080px;
    background:
      radial-gradient(ellipse at 50% 65%, rgba(224,122,79,0.18), transparent 55%),
      radial-gradient(ellipse at 50% 30%, rgba(217,162,107,0.10), transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 60%, #0c0907 100%);
    overflow:hidden;
    isolation:isolate;
    box-shadow:0 60px 160px rgba(0,0,0,0.6) inset;
  }

  /* film grain */
  .stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.4) 1px, transparent 1px);
    background-size: 3px 3px, 4px 4px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode:overlay;opacity:.22;
    animation:grain 1.2s steps(6) infinite;
    z-index:30;
  }
  @keyframes grain{
    0%{transform:translate(0,0)}
    20%{transform:translate(-2%,1%)}
    40%{transform:translate(1%,-2%)}
    60%{transform:translate(-1%,2%)}
    80%{transform:translate(2%,-1%)}
    100%{transform:translate(0,0)}
  }

  /* light leak vignette */
  .vignette{
    position:absolute;inset:0;pointer-events:none;z-index:25;
    background:
      radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,0,0,0.55) 95%);
  }

  /* horizontal beam */
  .beam{
    position:absolute;left:0;right:0;top:50%;height:280px;transform:translateY(-50%);
    background:linear-gradient(180deg, transparent, rgba(224,122,79,0.10) 50%, transparent);
    filter:blur(20px);z-index:1;pointer-events:none;
    animation:beamPulse 14s ease-in-out infinite;
  }
  @keyframes beamPulse{
    0%,100%{opacity:.5}
    40%{opacity:.9}
    70%{opacity:.6}
  }

  canvas#particles{
    position:absolute;inset:0;z-index:2;
  }

  /* center wordmark */
  .center{
    position:absolute;inset:0;display:grid;place-items:center;z-index:10;
  }
  .wrap{
    text-align:center;width:100%;padding:0 80px;
  }

  /* tiny eyebrow */
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-weight:300;letter-spacing:0.6em;
    font-size:18px;color:var(--gold);
    text-transform:uppercase;
    opacity:0;
    animation: eyebrowIn 1.2s cubic-bezier(.2,.7,.2,1) 0.6s forwards,
               eyebrowOut 0.8s ease-in 13.2s forwards;
  }
  @keyframes eyebrowIn{
    from{opacity:0;letter-spacing:1em;filter:blur(8px)}
    to{opacity:.9;letter-spacing:0.6em;filter:blur(0)}
  }
  @keyframes eyebrowOut{ to{opacity:0;transform:translateY(-6px)} }

  /* main wordmark */
  .wordmark{
    margin-top:32px;
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-size:188px;
    line-height:1;
    letter-spacing:0.04em;
    color:var(--ink);
    display:inline-flex;
    gap:0;
  }
  .wordmark span{
    display:inline-block;
    opacity:0;
    transform:translateY(40px) scale(.96);
    filter:blur(14px);
    text-shadow:0 0 40px rgba(224,122,79,0.0);
    animation: letterIn 1.1s cubic-bezier(.2,.7,.2,1) forwards,
               letterGlow 6s ease-in-out 3.5s infinite,
               letterOut 0.9s ease-in 13.0s forwards;
  }
  .wordmark span:nth-child(1){animation-delay:1.6s, 3.5s, 13.0s}
  .wordmark span:nth-child(2){animation-delay:1.75s,3.6s, 13.05s}
  .wordmark span:nth-child(3){animation-delay:1.9s, 3.7s, 13.10s}
  .wordmark span:nth-child(4){animation-delay:2.05s,3.8s, 13.15s}
  .wordmark span:nth-child(5){animation-delay:2.2s, 3.9s, 13.20s}
  .wordmark span:nth-child(6){animation-delay:2.35s,4.0s, 13.25s}
  .wordmark span:nth-child(7){animation-delay:2.5s, 4.1s, 13.30s}
  .wordmark span:nth-child(8){animation-delay:2.65s,4.2s, 13.35s}

  @keyframes letterIn{
    0%{opacity:0;transform:translateY(40px) scale(.96);filter:blur(14px)}
    60%{opacity:1;filter:blur(0)}
    100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  }
  @keyframes letterGlow{
    0%,100%{text-shadow:0 0 0 rgba(224,122,79,0)}
    50%{text-shadow:0 0 60px rgba(224,122,79,.35), 0 0 120px rgba(245,178,122,.2)}
  }
  @keyframes letterOut{
    to{opacity:0;transform:translateY(-10px);filter:blur(8px)}
  }

  /* underline */
  .rule{
    margin: 36px auto 28px;
    height:1px;width:0;
    background:linear-gradient(90deg, transparent, var(--accent) 50%, transparent);
    opacity:0;
    animation: ruleIn 1.6s cubic-bezier(.2,.7,.2,1) 3.4s forwards,
               ruleOut 0.7s ease-in 13.1s forwards;
  }
  @keyframes ruleIn{
    0%{width:0;opacity:0}
    40%{opacity:1}
    100%{width:520px;opacity:1}
  }
  @keyframes ruleOut{ to{opacity:0;width:0} }

  /* tagline */
  .tagline{
    font-family:'Inter',sans-serif;
    font-weight:300;
    font-size:30px;
    color:var(--ink-soft);
    letter-spacing:0.14em;
    text-transform:uppercase;
    opacity:0;
    animation: fadeUp 1.4s cubic-bezier(.2,.7,.2,1) 4.0s forwards,
               fadeOutSoft 0.7s ease-in 13.1s forwards;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(14px);filter:blur(8px)}
    to{opacity:.95;transform:translateY(0);filter:blur(0)}
  }
  @keyframes fadeOutSoft{ to{opacity:0;transform:translateY(-8px)} }

  /* scene 2 — CTA panel */
  .cta{
    position:absolute;inset:0;display:grid;place-items:center;z-index:11;
    opacity:0;pointer-events:none;
    animation: ctaIn 1.2s cubic-bezier(.2,.7,.2,1) 8.6s forwards;
  }
  @keyframes ctaIn{
    from{opacity:0;transform:scale(.98);filter:blur(12px)}
    to{opacity:1;transform:scale(1);filter:blur(0)}
  }
  .cta-inner{text-align:center;padding:0 80px}
  .cta-head{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:500;
    font-size:96px;
    line-height:1.05;
    color:var(--ink);
    letter-spacing:0.01em;
  }
  .cta-head em{
    font-style:italic;
    color:var(--accent-2);
    background:linear-gradient(180deg,var(--accent-2),var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .cta-sub{
    margin-top:40px;
    font-family:'Inter',sans-serif;
    font-weight:300;
    font-size:24px;
    color:var(--ink-soft);
    letter-spacing:0.32em;
    text-transform:uppercase;
  }
  .cta-url{
    margin-top:64px;
    display:inline-flex;align-items:center;gap:18px;
    padding:22px 44px;
    border:1px solid rgba(224,122,79,0.55);
    border-radius:999px;
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:26px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--ink);
    background:linear-gradient(180deg, rgba(224,122,79,0.10), rgba(224,122,79,0.02));
    box-shadow:0 0 60px rgba(224,122,79,0.18), inset 0 0 30px rgba(224,122,79,0.08);
    animation:urlPulse 3s ease-in-out 9.4s infinite;
  }
  .cta-url::before{
    content:"";width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 18px var(--accent);
  }
  @keyframes urlPulse{
    0%,100%{box-shadow:0 0 50px rgba(224,122,79,0.18), inset 0 0 30px rgba(224,122,79,0.08)}
    50%{box-shadow:0 0 90px rgba(224,122,79,0.35), inset 0 0 40px rgba(224,122,79,0.14)}
  }

  /* corner ornaments */
  .ornament{
    position:absolute;z-index:12;width:140px;height:140px;opacity:0;
    border:1px solid rgba(217,162,107,0.45);
    animation:ornIn 1.2s ease-out 2.4s forwards, ornOut 0.7s ease-in 13.1s forwards;
  }
  .ornament.tl{top:60px;left:60px;border-right:none;border-bottom:none}
  .ornament.tr{top:60px;right:60px;border-left:none;border-bottom:none}
  .ornament.bl{bottom:60px;left:60px;border-right:none;border-top:none}
  .ornament.br{bottom:60px;right:60px;border-left:none;border-top:none}
  @keyframes ornIn{ from{opacity:0;transform:scale(.7)} to{opacity:.7;transform:scale(1)} }
  @keyframes ornOut{ to{opacity:0;transform:scale(1.08)} }

  /* brand mark at bottom of scene 1 */
  .brandline{
    position:absolute;bottom:90px;left:0;right:0;text-align:center;z-index:11;
    font-family:'Inter',sans-serif;font-weight:300;letter-spacing:0.5em;
    text-transform:uppercase;color:var(--ink-soft);font-size:14px;opacity:0;
    animation:fadeUp 1.4s ease 5.4s forwards, fadeOutSoft 0.7s ease-in 13.1s forwards;
  }
  .brandline b{color:var(--accent-2);font-weight:400;letter-spacing:0.5em}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="beam"></div>
  <canvas id="particles" width="1080" height="1080"></canvas>

  <div class="ornament tl"></div>
  <div class="ornament tr"></div>
  <div class="ornament bl"></div>
  <div class="ornament br"></div>

  <div class="center">
    <div class="wrap">
      <div class="eyebrow">Måltilpasset håndverk</div>
      <div class="wordmark" aria-label="SKAPNETT">
        <span>S</span><span>K</span><span>A</span><span>P</span><span>N</span><span>E</span><span>T</span><span>T</span>
      </div>
      <div class="rule"></div>
      <div class="tagline">Ekspert på måltilpassede garderober</div>
    </div>
  </div>

  <div class="brandline">Designet · Tegnet · Levert <b>· over hele landet</b></div>

  <div class="cta">
    <div class="cta-inner">
      <div class="cta-head">Klar for <em>drømmeskapet?</em></div>
      <div class="cta-sub">La oss skape noe vakkert</div>
      <div class="cta-url">skapnett.no</div>
    </div>
  </div>

  <div class="vignette"></div>
</div>

<script>
/* Particle system: dust drifts in scene 1, converges toward wordmark area,
   then disperses outward for scene 2 reveal. Loops at ~14s. */
(function(){
  const cvs = document.getElementById('particles');
  const ctx = cvs.getContext('2d');
  const W = 1080, H = 1080;
  const CX = W/2, CY = H*0.52; // letters baseline-ish

  const PARTICLES = 220;
  const particles = [];

  function rand(a,b){return a+Math.random()*(b-a)}

  for(let i=0;i<PARTICLES;i++){
    const angle = Math.random()*Math.PI*2;
    const radius = rand(420, 700);
    particles.push({
      // start: distributed across canvas
      sx: rand(0,W), sy: rand(0,H),
      // converge target: ring near wordmark
      tx: CX + Math.cos(angle)*rand(80,460),
      ty: CY + Math.sin(angle)*rand(40,180),
      // disperse direction
      dx: Math.cos(angle), dy: Math.sin(angle),
      r: rand(0.6, 2.4),
      hueShift: Math.random(),
      twinkleSpeed: rand(0.6, 1.8),
      phase: Math.random()*Math.PI*2,
      depth: rand(0.4, 1.0)
    });
  }

  // timeline (seconds)
  const T = {
    driftIn: 1.6,    // 0 -> 1.6 drift in
    converge: 3.4,   // 1.6 -> 3.4 converge to wordmark
    hold: 8.4,       // 3.4 -> 8.4 hold/twinkle
    disperse: 9.6,   // 8.4 -> 9.6 disperse for CTA
    cta: 13.0,       // 9.6 -> 13.0 calm drift behind CTA
    fadeOut: 14.0    // fade
  };
  const LOOP = 14.0;

  function easeInOut(t){return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2}
  function easeOut(t){return 1-Math.pow(1-t,3)}

  let start = performance.now();

  function frame(now){
    let t = ((now - start)/1000) % LOOP;
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';

    for(let i=0;i<particles.length;i++){
      const p = particles[i];
      let x,y,alpha,size;

      if(t < T.driftIn){
        const k = t/T.driftIn;
        x = p.sx + Math.sin((t + p.phase)*0.6)*8*p.depth;
        y = p.sy + Math.cos((t + p.phase)*0.5)*8*p.depth - k*10;
        alpha = 0.15 + 0.35*easeOut(k)*p.depth;
        size = p.r * (0.7 + 0.3*k);
      } else if(t < T.converge){
        const k = easeInOut((t - T.driftIn)/(T.converge - T.driftIn));
        x = p.sx + (p.tx - p.sx)*k;
        y = p.sy + (p.ty - p.sy)*k;
        alpha = 0.5 + 0.45*p.depth;
        size = p.r * (1 + 0.6*k);
      } else if(t < T.hold){
        const tt = (t - T.converge);
        x = p.tx + Math.sin(tt*p.twinkleSpeed + p.phase)*6;
        y = p.ty + Math.cos(tt*p.twinkleSpeed*0.8 + p.phase)*4;
        const tw = 0.5 + 0.5*Math.sin(tt*2.2 + p.phase);
        alpha = 0.35 + 0.55*tw*p.depth;
        size = p.r * (1.1 + 0.3*tw);
      } else if(t < T.disperse){
        const k = easeOut((t - T.hold)/(T.disperse - T.hold));
        const dist = 380*k;
        x = p.tx + p.dx*dist;
        y = p.ty + p.dy*dist;
        alpha = (1-k)*0.7;
        size = p.r * (1.2 + 0.4*k);
      } else if(t < T.cta){
        // calm slow drift, dim
        const tt = t - T.disperse;
        x = p.tx + p.dx*380 + Math.sin(tt*0.3 + p.phase)*10;
        y = p.ty + p.dy*380 + Math.cos(tt*0.3 + p.phase)*10 - tt*4;
        alpha = 0.12 + 0.08*Math.sin(tt + p.phase);
        size = p.r * 0.9;
      } else {
        const k = (t - T.cta)/(LOOP - T.cta);
        alpha = (1-k)*0.1;
        size = p.r*0.8;
        x = p.tx + p.dx*380; y = p.ty + p.dy*380;
      }

      if(alpha <= 0) continue;
      // warm gold-coral color, varied
      const r = 245, g = 178 - 30*p.hueShift, b = 122 - 40*p.hueShift;
      const grd = ctx.createRadialGradient(x,y,0,x,y,size*6);
      grd.addColorStop(0, `rgba(${r|0},${g|0},${b|0},${alpha})`);
      grd.addColorStop(0.4, `rgba(${r|0},${g|0},${b|0},${alpha*0.35})`);
      grd.addColorStop(1, `rgba(${r|0},${g|0},${b|0},0)`);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(x,y,size*6,0,Math.PI*2);
      ctx.fill();

      // bright core
      ctx.fillStyle = `rgba(255,236,210,${Math.min(1,alpha*1.1)})`;
      ctx.beginPath();
      ctx.arc(x,y,size,0,Math.PI*2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
