<!DOCTYPE html>
<html lang="nb-NO">
<head>
<meta charset="UTF-8" />
<title>Skapnett Logo Intro — 3 sek</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --brown: #772F10;
    --beige: #FBF6ED;
    --orange: #FF6B2C;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#000; overflow:hidden; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--beige);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* subtle radial backdrop for warmth */
  .stage::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, #fff 0%, var(--beige) 70%, #efe5d3 100%);
  }

  .lockup {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0px;
    will-change: transform;
  }

  /* === SN icon as inline SVG === */
  .sn-svg {
    width: 360px;
    height: 360px;
    overflow: visible;
  }
  /* Each path/rect uses stroke-dasharray + stroke-dashoffset to "draw in".
     CSS var --d controls fill opacity once drawing finishes. */
  .sn-svg .stroke {
    fill: none;
    stroke-width: 9;
    stroke-linecap: butt;
    stroke-linejoin: miter;
    stroke-dasharray: var(--len, 1000);
    stroke-dashoffset: var(--len, 1000);
    will-change: stroke-dashoffset;
  }
  .sn-svg .stroke.cut { stroke: #FBF6ED; }
  #plate {
    transform-origin: center center;
    transform: scale(0);
    will-change: transform;
  }

  /* === Wordmark "skapnett" === */
  .wordmark {
    position: relative;
    display: inline-block;
    overflow: hidden;
    margin-left: 40px;
    padding-right: 4px;
    will-change: clip-path, opacity;
    clip-path: inset(0 100% 0 0);
    opacity: 0;
  }
  .wordmark span.txt {
    display: inline-block;
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 220px;
    line-height: 1;
    letter-spacing: -10px;
    color: var(--brown);
  }

  /* Glow flash overlay */
  .flash {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 60%);
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
    z-index: 10;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="lockup" id="lockup">

    <!-- SN ICON SVG: solid brown plate, beige strokes "carve" the SN letters -->
    <svg class="sn-svg" id="sn" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
      <!-- Solid brown background plate -->
      <rect id="plate" x="0" y="0" width="200" height="140" rx="2" fill="#772F10" />

      <!-- LEFT: "S" carved with 5 beige strokes (zig-zag) -->
      <!-- Top horizontal -->
      <line class="stroke cut" id="p-s1" style="--len: 60" x1="34" y1="40" x2="94" y2="40" />
      <!-- Right vertical (top half) -->
      <line class="stroke cut" id="p-s2" style="--len: 30" x1="94" y1="40" x2="94" y2="70" />
      <!-- Middle horizontal -->
      <line class="stroke cut" id="p-s3" style="--len: 60" x1="94" y1="70" x2="34" y2="70" />
      <!-- Left vertical (bottom half) -->
      <line class="stroke cut" id="p-s4" style="--len: 30" x1="34" y1="70" x2="34" y2="100" />
      <!-- Bottom horizontal -->
      <line class="stroke cut" id="p-s5" style="--len: 60" x1="34" y1="100" x2="94" y2="100" />

      <!-- RIGHT: "N" carved with 3 beige strokes -->
      <!-- Left vertical -->
      <line class="stroke cut" id="p-n1" style="--len: 60" x1="116" y1="40" x2="116" y2="100" />
      <!-- Diagonal -->
      <line class="stroke cut" id="p-n2" style="--len: 76" x1="116" y1="40" x2="166" y2="100" />
      <!-- Right vertical -->
      <line class="stroke cut" id="p-n3" style="--len: 60" x1="166" y1="40" x2="166" y2="100" />
    </svg>

    <!-- Wordmark -->
    <div class="wordmark" id="wm">
      <span class="txt">skapnett</span>
    </div>
  </div>
  <div class="flash" id="flash"></div>
</div>

<script>
  // Timeline (3.0s total)
  // 0.00 - 0.50  border draws in
  // 0.50 - 1.20  S strokes draw in (staggered)
  // 1.10 - 1.70  N strokes draw in (staggered, overlapping with end of S)
  // 1.75 - 1.90  flash pop
  // 1.85 - 2.60  icon slides left, wordmark wipes in
  // 2.60 - 3.00  hold

  const clamp01 = v => Math.max(0, Math.min(1, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
  const easeBack = t => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
  const lerp = (a,b,t) => a + (b-a)*t;

  // Helper: set stroke draw progress 0..1 for a path that uses --len
  const drawProgress = (el, p) => {
    const len = parseFloat(getComputedStyle(el).getPropertyValue('--len')) || 1000;
    el.style.strokeDashoffset = (len * (1 - p)).toString();
  };
  const localTween = (T, start, dur, ease=easeOut) => ease(clamp01((T - start) / dur));

  function setTime(T) {
    // plate scales in (0 → full) with bounce
    const plateT = localTween(T, 0.00, 0.45, easeBack);
    document.getElementById('plate').style.transform = `scale(${plateT.toFixed(4)})`;

    // S strokes (5)
    const sStarts = [0.50, 0.62, 0.74, 0.86, 0.98];
    const sIds = ['p-s1','p-s2','p-s3','p-s4','p-s5'];
    sIds.forEach((id, i) => {
      drawProgress(document.getElementById(id), localTween(T, sStarts[i], 0.18));
    });

    // N strokes (3) - start a touch before S ends to overlap
    const nStarts = [1.10, 1.28, 1.46];
    const nIds = ['p-n1','p-n2','p-n3'];
    nIds.forEach((id, i) => {
      drawProgress(document.getElementById(id), localTween(T, nStarts[i], 0.22));
    });

    // Flash pop when icon finishes
    const flashP = localTween(T, 1.70, 0.20, easeOut);
    const flashDown = localTween(T, 1.85, 0.30);
    const flashAmt = Math.max(0, flashP - flashDown);
    document.getElementById('flash').style.opacity = flashAmt.toFixed(3);

    // Icon scales up briefly at flash
    const pop = localTween(T, 1.65, 0.45, easeBack);
    const scale = 1 + 0.08 * (pop * (1 - pop) * 4); // peak in middle
    document.getElementById('sn').style.transform = `scale(${scale.toFixed(4)})`;

    // Wordmark width animates from 0 → natural width (~1100px),
    // and flex centering on .lockup keeps the whole thing centered automatically.
    const wm = document.getElementById('wm');
    const wmT = localTween(T, 1.85, 0.7, easeInOut);
    const targetWidth = 1100; // measured natural width of "skapnett" at 220px Sora 800
    wm.style.width = `${(targetWidth * wmT).toFixed(2)}px`;
    wm.style.clipPath = `inset(0 ${(100*(1-wmT)).toFixed(2)}% 0 0)`;
    wm.style.opacity = clamp01((T - 1.90) / 0.20).toFixed(3);
  }

  window.SETTIME = setTime;
  const params = new URLSearchParams(location.search);
  if (params.get('play') === '1') {
    const t0 = performance.now();
    const loop = () => {
      const t = ((performance.now() - t0) / 1000) % 3.0;
      setTime(t);
      requestAnimationFrame(loop);
    };
    loop();
  } else if (params.has('t')) {
    setTime(parseFloat(params.get('t')));
  } else {
    setTime(0);
  }
</script>
</body>
</html>
