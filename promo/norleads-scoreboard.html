<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>NORLEADS — Scoreboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg:#040810;
    --lime:#C8FF00; --cyan:#00E5FF; --amber:#FFB000; --pink:#FF3D7F;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Manrope',sans-serif;}
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  #canvas{position:relative;width:1920px;height:1080px;background:var(--bg);}

  #vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 48%, transparent 35%, rgba(0,0,0,.75) 100%);pointer-events:none;z-index:30;}
  #scanline-overlay{position:absolute;inset:0;pointer-events:none;z-index:32;opacity:.06;
    background:repeating-linear-gradient(0deg, #fff 0px, #fff 1px, transparent 1px, transparent 4px);}

  /* ---------- LED grid ---------- */
  #grid{position:absolute;inset:0;z-index:5;}
  .cell{position:absolute;width:34px;height:34px;border-radius:3px;background:#0a1018;opacity:1;}

  /* ---------- scan bar that sweeps the grid ---------- */
  #scanbar{position:absolute;top:0;left:-200px;width:200px;height:1080px;z-index:6;pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(200,255,0,.35), rgba(0,229,255,.5), rgba(200,255,0,.35), transparent);
    mix-blend-mode:screen;opacity:0;}

  /* ---------- monogram ---------- */
  #mono-wrap{position:absolute;left:50%;top:30%;width:280px;height:285px;z-index:10;opacity:0;transform:translate(-50%,-50%) scale(.25);}
  #mono-svg{width:100%;height:100%;overflow:visible;}
  .mono-fill{fill:url(#flowGradient);}
  #mono-glow{position:absolute;inset:-40px;background:radial-gradient(circle, rgba(200,255,0,.35), transparent 65%);z-index:9;opacity:0;pointer-events:none;}
  .mono-scan{position:absolute;left:-20%;top:0;width:140%;height:8px;background:linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
    mix-blend-mode:screen;opacity:0;pointer-events:none;}

  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;}

  /* ---------- lockup ---------- */
  #lockup{position:absolute;left:50%;top:58%;text-align:center;z-index:10;transform:translate(-50%,0);}
  #divider{width:420px;height:2px;margin:0 auto 24px;transform:scaleX(0);
    background:linear-gradient(90deg, transparent, var(--lime), var(--cyan), transparent);}
  #wordmark{font-weight:800;font-size:74px;letter-spacing:1px;color:#eafff0;}
  #wordmark span{display:inline-block;opacity:0;transform:translateY(10px);}
  #urlmark{margin-top:18px;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:19px;letter-spacing:10px;
    text-transform:uppercase;color:rgba(200,255,0,.6);opacity:0;}

  #blackout{position:absolute;inset:0;background:#000;opacity:1;pointer-events:none;z-index:50;}
</style>
</head>
<body>

    <div id="lockup">
      <div id="divider"></div>
      <div id="wordmark">
        <span>n</span><span>o</span><span>r</span><span>l</span><span>e</span><span>a</span><span>d</span><span>s</span>
      </div>
      <div id="urlmark">norleads.no</div>
    </div>

    <div id="flash"></div>
    <div id="blackout"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
const COLS = 56, ROWS = 32, SIZE = 34, GAP = 2;
const STEP = SIZE + GAP;
const totalW = COLS * STEP, totalH = ROWS * STEP;
const offX = (1920 - totalW) / 2, offY = (1080 - totalH) / 2;
const palette = ['var(--lime)','var(--cyan)','var(--amber)','var(--pink)'];

const grid = document.getElementById('grid');
const frag = document.createDocumentFragment();
const cells = [];
for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    const el = document.createElement('div');
    el.className = 'cell';
    el.style.left = (offX + c * STEP) + 'px';
    el.style.top = (offY + r * STEP) + 'px';
    frag.appendChild(el);
    cells.push({ el, r, c,
      cx: offX + c * STEP + SIZE / 2,
      cy: offY + r * STEP + SIZE / 2 });
  }
}
grid.appendChild(frag);

const cx0 = 1920 / 2, cy0 = 1080 / 2;
cells.forEach(cell => {
  cell.distFromCenter = Math.hypot(cell.cx - cx0, cell.cy - cy0);
  cell.distFromEdge = Math.min(cell.cx, 1920 - cell.cx, cell.cy, 1080 - cell.cy);
  cell.color = palette[(cell.r + cell.c) % palette.length];
});
const maxEdgeDist = Math.max(...cells.map(c => c.distFromEdge));
const maxCenterDist = Math.max(...cells.map(c => c.distFromCenter));

/* ---------- master timeline, ~11s loop ---------- */
const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5 });
window.masterTL = tl;
window.cellsData = cells;

tl.set('#blackout', { opacity: 1 });
tl.to('#blackout', { opacity: 0, duration: 0.4, ease: 'power1.in' }, 0.0);

/* 0.0 - 1.5  BOOT — diagonal wave flicker-on, bottom-left to top-right */
cells.forEach(cell => {
  const wave = (cell.r + cell.c) / (ROWS + COLS);
  const t0 = 0.05 + wave * 1.2;
  tl.to(cell.el, { backgroundColor: cell.color, duration: 0.12, ease: 'none' }, t0);
  tl.to(cell.el, { backgroundColor: '#0a1018', duration: 0.18, ease: 'none' }, t0 + 0.12 + Math.random() * 0.15);
  tl.to(cell.el, { backgroundColor: cell.color, opacity: 0.85, duration: 0.25, ease: 'none' }, t0 + 0.35);
});

/* 1.5 - 3.5  CHASE — bright scanbar sweeps across twice, cells flash as it passes */
tl.set('#scanbar', { opacity: 1 }, 1.5);
tl.fromTo('#scanbar', { left: -200 }, { left: 1920, duration: 0.9, ease: 'power1.inOut' }, 1.55);
tl.fromTo('#scanbar', { left: -200 }, { left: 1920, duration: 0.9, ease: 'power1.inOut' }, 2.55);
tl.to('#scanbar', { opacity: 0, duration: 0.2 }, 3.4);
cells.forEach(cell => {
  const passT1 = 1.55 + (cell.cx + 200) / 2120 * 0.9;
  const passT2 = 2.55 + (cell.cx + 200) / 2120 * 0.9;
  tl.to(cell.el, { backgroundColor: '#ffffff', duration: 0.06 }, passT1);
  tl.to(cell.el, { backgroundColor: cell.color, duration: 0.18 }, passT1 + 0.06);
  tl.to(cell.el, { backgroundColor: '#ffffff', duration: 0.06 }, passT2);
  tl.to(cell.el, { backgroundColor: cell.color, duration: 0.18 }, passT2 + 0.06);
});

/* 3.5 - 4.5  COLLAPSE — cells ripple inward from edges toward center, fading as they go */
cells.forEach(cell => {
  const delay = 3.5 + (1 - cell.distFromCenter / maxCenterDist) * 0.15;
  tl.to(cell.el, {
    x: (cx0 - cell.cx) * 0.96, y: (cy0 - cell.cy) * 0.96,
    opacity: 0, scale: 0.2, duration: 0.55, ease: 'power2.in'
  }, delay);
});

/* 4.5 - 5.3  POP — flash + mark snaps in at center */
tl.to('#flash', { opacity: 0.9, duration: 0.04 }, 4.55);
tl.to('#flash', { opacity: 0, duration: 0.3, ease: 'power2.out' }, 4.6);
tl.fromTo('#mono-wrap', { opacity: 0, scale: 0.25 },
  { opacity: 1, scale: 1, duration: 0.55, ease: 'back.out(2)', immediateRender: false }, 4.6);
tl.fromTo('#mono-glow', { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, 4.65);
tl.fromTo('.mono-scan', { top: '0%', opacity: 0.8 }, { top: '100%', opacity: 0, duration: 0.5, ease: 'power1.in', immediateRender: false }, 4.7);

/* 5.3 - 8.3  HOLD — wordmark + url type on, periodic scanline sweeps the mark */
tl.to('#divider', { scaleX: 1, duration: 0.5, ease: 'power2.out' }, 5.3);
tl.to('#wordmark span', { opacity: 1, y: 0, duration: 0.4, stagger: 0.04, ease: 'power2.out' }, 5.5);
tl.to('#urlmark', { opacity: 1, duration: 0.5 }, 6.0);
[5.8, 7.0].forEach(t => {
  tl.fromTo('.mono-scan', { top: '0%', opacity: 0.7 }, { top: '100%', opacity: 0, duration: 0.6, ease: 'power1.in', immediateRender: false }, t);
});

/* 8.3 - 9.0  fade lockup, mark shrinks back to a point */
tl.to(['#divider', '#wordmark span', '#urlmark'], { opacity: 0, duration: 0.3 }, 8.3);
tl.to('#mono-glow', { opacity: 0, duration: 0.3 }, 8.3);
tl.to('#mono-wrap', { opacity: 0, scale: 0.2, duration: 0.4, ease: 'power2.in' }, 8.3);

/* 9.0 - 10.2  EXPLODE — grid bursts back outward from center to fill the screen again */
tl.to('#flash', { opacity: 0.5, duration: 0.04 }, 9.0);
tl.to('#flash', { opacity: 0, duration: 0.3 }, 9.05);
cells.forEach(cell => {
  const delay = 9.0 + (cell.distFromCenter / maxCenterDist) * 0.25;
  tl.fromTo(cell.el,
    { x: (cx0 - cell.cx) * 0.96, y: (cy0 - cell.cy) * 0.96, opacity: 0, scale: 0.2 },
    { x: 0, y: 0, opacity: 0.85, scale: 1, duration: 0.55, ease: 'power2.out', immediateRender: false },
    delay);
});

/* 10.2 - 10.6  hold full grid briefly */
/* 10.6 - 11.4  fade to black, ready to loop */
tl.to('#blackout', { opacity: 1, duration: 0.8, ease: 'power2.in' }, 10.6);

/* reset for next loop */
tl.set('#wordmark span', { opacity: 0, y: 10 }, 11.4);
tl.set('#urlmark', { opacity: 0 }, 11.4);
tl.set('#mono-wrap', { opacity: 0, scale: 0.25 }, 11.4);
tl.set(cells.map(c => c.el), { x: 0, y: 0, scale: 1, opacity: 1, backgroundColor: '#0a1018' }, 11.4);
</script>
</body>
</html>
